# CDF operator profile, NOT native Codex config. Do not install as config.toml.
schema = 1
selected_profile = "balanced"
selection_mode = "advisory"
checked_on = "2026-11-05"

[budget]
parallel_agents_max = 1
review_medium_by_default = false
allow_unverified_fallback = true

[balanced]
parallel_agents_max = 2
review_medium_by_default = false
allow_unverified_fallback = true

[quality]
parallel_agents_max = 2
review_medium_by_default = true
allow_unverified_fallback = true

[candidates]
# Candidates require runtime capability validation. Never assume model identifiers
# from this file are active, or all efforts are supported for all models.
t0 = "inherit"
t1 = "gpt-6.1-terra:low"
t2 = "gpt-6.1-sol:medium"
t3 = "gpt-6.1-sol:medium"
explorer = "gpt-6-luna:medium"
reviewer = "gpt-6.1-terra:medium"
diagnostician = "gpt-6.1-sol:medium"

[fallback]
when_model_unavailable = "inherit_with_disclosure"
when_effort_unavailable = "runtime_default_with_disclosure"
when_review_agent_unavailable = "block_required_review_and_offer_human_review"
